services:
  qbt:
    build: .
    image: qbt-kiosk:latest
    restart: unless-stopped
    ports:
      - "4443:4443"
    environment:
      # Owner uid/gid of the container process and of downloaded files. Set these
      # to match the account/group that owns the host download share. (The
      # downloads are also chmod'd to 666 by the fix-downloads service, so access
      # works regardless — these just control ownership in `ls -l`.)
      - USER_ID=10001
      - GROUP_ID=1001
      - WEB_LISTENING_PORT=4443
    volumes:
      # Chromium saves to /config/Downloads (capital D) — mount that to the host.
      - /files/shared/drive:/config/Downloads:rw
